name: Node checks

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check server syntax
        run: node --check app/server.mjs
      - name: Check frontend syntax
        run: node --check app/app.js
      - name: Run security regression checks
        run: node --test test/*.test.mjs
